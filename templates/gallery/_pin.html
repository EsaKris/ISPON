{% load wagtailimages_tags %}{% image ai.image width-600 as th %}{% image ai.image width-1600 as fl %}<figure class="pin"><button type="button" data-lb data-group="pins" data-full="{{ fl.url }}" data-title="{{ ai.title }}" data-desc="{{ ai.description }}" data-alt="{{ ai.alt_text }}" aria-label="Open photo: {{ ai.alt_text }}"><img src="{{ th.url }}" width="{{ th.width }}" height="{{ th.height }}" alt="{{ ai.alt_text }}" loading="lazy"></button><figcaption><h3>{{ ai.title }}</h3>{% if ai.description %}<p>{{ ai.description }}</p>{% endif %}{% if show_album %}<a class="m" href="{{ ai.page.url }}">{{ ai.page.title }}</a>{% endif %}</figcaption></figure>
